name: Protocol tests

on:
  push:
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.0.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux host dependencies
        run: |
          apt-get update
          apt-get install -y libbsd-dev

      - name: Install pytest dependencies
        run: python -m pip install -r tests/protocol/requirements.txt

      - name: Configure Linux target
        working-directory: tests/protocol
        run: idf.py --preview set-target linux

      - name: Build test application
        working-directory: tests/protocol
        run: idf.py build

      - name: Run protocol tests
        working-directory: tests/protocol
        run: python -m pytest
